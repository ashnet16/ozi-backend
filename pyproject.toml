[tool.poetry]
name = "ozi-backend"
version = "0.1.0"
description = "Real-time semantic search and analytics over Farcaster data from Snapchain"
authors = ["Ashley Mitchell"]
license = "AGPL-3.0-only"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
grpcio = ">=1.60.0"
grpcio-tools = ">=1.60.0"
protobuf = ">=4.25.1"
kafka-python = ">=2.0.2"
httpx = ">=0.26.0"

[tool.poetry.group.dev.dependencies]
black = "*"
isort = "*"
flake8 = "*"
mypy = "*"
pytest = "*"
pre-commit = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Formatting + Linting Configs
[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 9999
extend-ignore = ["E203", "W503", "E501"]
exclude = ["proto/"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
